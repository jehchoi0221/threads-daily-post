name: Daily Threads post

on:
  schedule:
    # 매시 7분, 10:07~22:07 KST (UTC 01~13시). 하루 중 한 번만 무작위로 게시됨
    - cron: "7 1-13 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = 평소대로, dry_run = 글과 사진만 만들어 보기(게시 안 함), force = 지금 게시(하루 1개 제한은 유지)"
        type: choice
        options: [auto, dry_run, force]
        default: dry_run

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Make and publish today's post
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXPECTED_USERNAME: jinggle_m
          RUN_MODE: ${{ github.event.inputs.mode || 'auto' }}
          TEXT_MODEL: ${{ vars.TEXT_MODEL }}
          IMAGE_MODEL: ${{ vars.IMAGE_MODEL }}
        run: python3 post.py

      - name: Save output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output
          path: out/
          if-no-files-found: ignore
          retention-days: 7
