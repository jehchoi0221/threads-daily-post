name: Daily Threads post

on:
  # 자동 일정 없음. 사용자에게 초안을 보여주고 명확히 승인받은 뒤에만 수동 실행.
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run = 초안만 생성, force = 사용자가 해당 초안을 승인한 뒤에만 게시"
        type: choice
        options: [dry_run, force]
        default: dry_run

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Make and publish today's post
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          EXPECTED_USERNAME: jinggle_m
          RUN_MODE: ${{ github.event.inputs.mode || 'dry_run' }}
          TEXT_MODEL: ${{ vars.TEXT_MODEL }}
          IMAGE_MODEL: ${{ vars.IMAGE_MODEL }}
        run: python3 post.py

      - name: Save output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output
          path: out/
          if-no-files-found: ignore
          retention-days: 7
